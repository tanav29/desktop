services:
  desktop:
    build: .
    container_name: linux-desktop
    ports:
      - "6080:6080"
      - "8095:8095"
    volumes:
      - ./workspace:/workspace
    environment:
      - DISPLAY=:99
      - RESOLUTION=1600x900
    init: true
    mem_limit: 3g
    cpus: 2
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:6080/vnc_lite.html >/dev/null && curl -fsS http://127.0.0.1:8095/api/health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s