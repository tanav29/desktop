services:
  desktop:
    build: .
    container_name: linux-desktop
    ports:
      - "6080:6080"
      - "8095:8095"
    volumes:
      - ./workspace:/workspace
    environment:
      - DISPLAY=:99
      - RESOLUTION=1600x900
      # GitHub token for git auth + GitHub API calls inside the container
      - GH_TOKEN=${GH_TOKEN:-}
      - GITHUB_TOKEN=${GH_TOKEN:-}
      # Git identity for commits made by the agent
      - GIT_AUTHOR_NAME=${GIT_AUTHOR_NAME:-eve-agent}
      - GIT_AUTHOR_EMAIL=${GIT_AUTHOR_EMAIL:-eve@agent.local}
      - GIT_COMMITTER_NAME=${GIT_COMMITTER_NAME:-eve-agent}
      - GIT_COMMITTER_EMAIL=${GIT_COMMITTER_EMAIL:-eve@agent.local}
    init: true
    mem_limit: 3g
    cpus: 2
    # Bring the container back automatically; the entrypoint exits on purpose
    # when any part of the desktop stack dies.
    restart: unless-stopped
    # /api/health now probes the real X display (503 when it's down), so this
    # fails on a dead desktop instead of passing on a static noVNC page.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:6080/vnc.html >/dev/null && curl -fsS http://127.0.0.1:8095/api/health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s