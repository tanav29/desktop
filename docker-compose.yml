services:
  desktop:
    build: .
    container_name: linux-desktop
    ports:
      - "6080:6080"
    volumes:
      - ./workspace:/workspace
    environment:
      - DISPLAY=:99
      - RESOLUTION=1600x900
    init: true
    mem_limit: 3g
    cpus: 2
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:6080/vnc.html"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s